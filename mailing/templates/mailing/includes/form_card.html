{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
                <h4 class="mb-0 fw-bold">{% block form_title %}{% endblock %}</h4>
            </div>
            <div class="card-body p-4">
                <form method="post" {% if enctype %}enctype="{{ enctype }}"{% endif %}>
                    {% csrf_token %}
                    {{ form.non_field_errors }}

                    {% block form_fields %}{% endblock %}

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">
                            {% block submit_text %}Сохранить{% endblock %}
                        </button>
                        <a href="{% block cancel_url %}{% endblock %}" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
